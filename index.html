      '<div class="sum-line" id="sumComp"></div>' +
      '<div class="btns" style="padding-top:4px"><button class="btn outline" data-la="addComp">' + ic('plus') + 'Agregar componente</button></div>' +
      '<div class="block-title">Evaluaciones de la Evaluación Continua</div>' +
      k.notas.evaluaciones.map((x, i) => '<div class="f-card"><div class="f-row">' + fld('Evaluación', inp('notas.evaluaciones.' + i + '.nombre', x.nombre, 'text')) +
        '<button class="icon-btn" data-la="delEval" data-i="' + i + '" aria-label="Eliminar evaluación">' + ic('x') + '</button></div>' +
        '<div class="f-row">' + fld('Peso %', inp('notas.evaluaciones.' + i + '.peso', x.peso, 'num')) + fld('Nota (0 a 20)', inp('notas.evaluaciones.' + i + '.nota', x.nota, 'grade', ' placeholder="Pendiente"')) + '</div></div>').join('') +
      '<div class="sum-line" id="sumEval"></div>' +
      '<div class="btns" style="padding-top:4px"><button class="btn outline" data-la="addEval">' + ic('plus') + 'Agregar evaluación</button></div>' +
      '<div class="res" id="resNotas"></div>' +
      '<div class="btns"><button class="btn" data-la="viewNotas">Ver la pantalla de Notas</button></div>';
  }
  function computed(el) {
    const k = c();
    $('#admPrev', el).innerHTML = courseRow(k, 'data-la="none"');
    $('.ab-title', el).textContent = k.nombre || 'Curso';
    if (st.tab === 'horario') {
      k.slots.forEach((s, i) => { const w = $('[data-w="slot' + i + '"]', el); if (w) w.textContent = toMin(s.fin) <= toMin(s.ini) ? 'La hora de fin debe ser posterior a la de inicio.' : ''; });
    }
    if (st.tab === 'asistencia') {
      const h = k.horas, por = Math.max(0, h.total - h.asist - h.faltas), over = h.asist + h.faltas > h.total;
      $('#resAsis', el).innerHTML = '<div style="display:flex;gap:16px;align-items:center"><div>' + donut(110, h) + '</div><div style="flex:1">' +
        '<div class="r-big"><span>Inasistencia</span><b>' + pctFaltas(k) + '%</b></div><div class="r-big"><span>Asistencia</span><b>' + pctAsist(k) + '%</b></div>' +
        '<div class="r-big"><span>Por dictar</span><b>' + por + ' h</b></div></div></div>' +
        '<div class="r-f">% inasistencia = ' + h.faltas + ' ÷ ' + h.total + ' × 100 = ' + (h.total > 0 ? r2(h.faltas / h.total * 100) : 0) + '% → se muestra ' + pctFaltas(k) + '%</div>' +
        (over ? '<div class="f-warn">Las horas asistidas más las de inasistencia superan el total.</div>' : '');
    }
    if (st.tab === 'notas') {
      const ev = k.notas.evaluaciones, comps = k.notas.componentes, se = sumPesos(ev), scp = sumPesos(comps);
      const okBox = (s, lbl) => Math.abs(s - 100) < 0.001 ? '<span class="ok">✓ ' + lbl + ' suman 100%</span>' : '<span class="bad">⚠ ' + lbl + ' suman ' + r2(s) + '% (deben sumar 100%)</span>';
      $('#sumComp', el).innerHTML = okBox(scp, 'Los pesos');
      $('#sumEval', el).innerHTML = okBox(se, 'Los pesos');
      const g = ev.filter(e => isNum(e.nota)), evc = calcContinua(k), fin = calcFinal(k);
      const evRaw = g.length && sumPesos(g) > 0 ? g.reduce((s, e) => s + e.nota * (+e.peso || 0), 0) / sumPesos(g) : null;
      const fEvc = g.length ? '(' + g.map(e => r2(e.nota) + '×' + r2(+e.peso || 0)).join(' + ') + ') ÷ ' + r2(sumPesos(g)) + ' = ' + (evRaw != null ? r2(evRaw) + ' → redondeado: ' + roundNota(evRaw) : '-') : 'sin notas registradas';
      const cv = comps.map(x => [x, compValue(k, x)]).filter(x => x[1] != null);
      const fFin = cv.length ? '(' + cv.map(x => r2(x[1]) + '×' + r2(+x[0].peso || 0)).join(' + ') + ') ÷ ' + r2(sumPesos(cv.map(x => x[0]))) : 'sin componentes calificados';
      const pend = ev.length - g.length;
      $('#resNotas', el).innerHTML = '<div class="r-big"><span>Evaluación Continua</span><b>' + fmtNota(evc) + '</b></div>' +
        '<div class="r-f">EVC = ' + fEvc + (pend && !D.OPCIONES.parcial ? '<br>Faltan ' + pend + ' nota(s): la app muestra "-" hasta completarlas.' : '') + '</div>' +
        '<div class="r-big" style="margin-top:8px"><span>Promedio final</span><b>' + fmtFinal(fin) + '</b></div>' +
        '<div class="r-f">Final = ' + fFin + (fin != null ? ' = ' + r2(fin) + ' → redondeado: ' + fmtFinal(fin) : '') + '</div>';
    }
  }
  function render(el) {
    $('.content', el).innerHTML = '<div class="adm-prev" id="admPrev"></div>' + tabs() + body() + '<div style="height:30px"></div>';
    computed(el);
  }
  return {
    html: topbar({ left: 'back', title: '' }) + sub('Editar curso · se guarda solo') + '<main class="content cream"></main>',
    mount(el) {
      if (!c()) { setTimeout(pop, 0); return; }
      render(el);
      const box = $('.content', el);
      const onField = e => {
        const t = e.target.closest('[data-f]'); if (!t || t.dataset.f === '_pct') return;
        const k = c(), type = t.dataset.t;
        if (type === 'color') {
          const v = t.value.trim();
          if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
          k.color = v.toUpperCase(); $('#colPrev', el).style.background = k.color;
          $$('.sw', el).forEach(s => s.classList.toggle('on', s.dataset.c.toLowerCase() === k.color.toLowerCase()));
        } else {
          const v = parseVal(type, t.value);
          setPath(k, t.dataset.f, v);
          if (e.type === 'change' && (type === 'grade' || type === 'num' || type === 'int')) t.value = v == null ? '' : v;
        }
        if (t.dataset.f.indexOf('.tipo') > 0) { saveData(); render(el); return; }
        saveData(); computed(el);
      };
      box.addEventListener('input', onField);
      box.addEventListener('change', onField);
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-la]'); if (!b) return;
        const k = c(), la = b.dataset.la;
        if (la === 'none') return;
        if (la === 'tab') { st.tab = b.dataset.t; render(el); return; }
        if (la === 'color') { k.color = b.dataset.c; saveData(); render(el); return; }
        if (la === 'addSlot') { k.slots.push({ dow: 1, ini: '08:00', fin: '10:00', aula: 'AULA' }); }
        if (la === 'delSlot') { k.slots.splice(+b.dataset.i, 1); }
        if (la === 'addEval') { k.notas.evaluaciones.push({ nombre: 'Evaluación ' + (k.notas.evaluaciones.length + 1), peso: 0, nota: null }); }
        if (la === 'delEval') { k.notas.evaluaciones.splice(+b.dataset.i, 1); }
        if (la === 'addComp') { k.notas.componentes.push({ nombre: 'Examen final', peso: 0, tipo: 'directa', nota: null }); }
        if (la === 'delComp') { k.notas.componentes.splice(+b.dataset.i, 1); }
        if (la === 'applyPct') {
          const v = parseVal('num', $('[data-f="_pct"]', el).value);
          if (!(v >= 0 && v <= 100)) { toast('Ingresa un porcentaje entre 0 y 100'); return; }
          k.horas.faltas = Math.round(k.horas.total * v / 100);
          if (k.horas.asist + k.horas.faltas > k.horas.total) k.horas.asist = Math.max(0, k.horas.total - k.horas.faltas);
          toast('Inasistencia: ' + k.horas.faltas + ' de ' + k.horas.total + ' horas');
        }
        if (la === 'viewNotas') { S.logged = true; store.set('logged', true); S.tab = 'aula'; const id = k.id; setRoot('intranet'); push('curso', { id }); setTimeout(() => push('notas', { id }), DUR.push + 60); return; }
        if (la === 'delete') {
          modal({ title: 'Eliminar curso', body: '¿Eliminar <b>' + esc(k.nombre) + '</b> de la app?', actions: [{ label: 'Cancelar' }, { label: 'Eliminar', cls: 'danger', fn: () => {
            D.CURSOS.splice(D.CURSOS.indexOf(k), 1); saveData(); toast('Curso eliminado'); pop();
          } }] });
          return;
        }
        saveData(); render(el);
      });
    },
  };
};

    actions: [{ label: 'Cancelar' }, { label: 'Restablecer', cls: 'danger', fn: () => {

  }),

/* ---------- Botón "atrás" de Android ---------- */
window.__androidBack = function () {
  const m = $$('.modal-wrap').pop(); if (m) { hideAlert(m); return; }
  if (sheetOpen) { closeSheet(); return; }
  if (drawerOpen) { closeDrawer(); return; }
  if (S.stack.length > 1) { pop(); return; }
  const root = S.stack[0] ? S.stack[0].name : '';
  if (root && root !== 'intranet' && root !== 'splash') { setRoot('intranet'); return; }
  if (window.AndroidApp && window.AndroidApp.exit) window.AndroidApp.exit();
  else if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'exit' }));
};

/* ---------- Estilo de barras según la versión de iOS (iOS 26 = barras de vidrio) ---------- */
function isIOS26() {
  const ua = navigator.userAgent || '';
  const apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (!apple) return false;
  const v = ua.match(/Version\/(\d+)/);
  if (v && +v[1] >= 26) return true;
  const os = ua.match(/OS (\d+)_/);
  if (os && +os[1] >= 26) return true;
  /* En la app de inicio el texto de versión puede no venir: se reconoce Safari 26 por sus funciones nuevas */
  try { return CSS.supports('text-wrap-style', 'pretty') && CSS.supports('anchor-name', '--a'); } catch (e) { return false; }
}
function applyStyle() {
  const o = D.OPCIONES.estilo || 'auto';
  const on = o === 'ios26' || (o === 'auto' && isIOS26());
  document.documentElement.classList.toggle('ios26', on);
}

/* ---------- Arranque ---------- */
function clock() {
  const n = new Date(), h = n.getHours() % 12 || 12;
  $('#sbTime').textContent = h + ':' + pad(n.getMinutes());
}
/* En la app instalada en iPhone, iOS calcula la pantalla sin la barra de estado y deja una franja
   en blanco abajo. Se usa el alto real de la pantalla para que la app llegue hasta el borde. */
function fitHeight() {
  const de = document.documentElement;
  const standalone = window.navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (!standalone || !window.matchMedia('(max-width:500px)').matches) { de.style.removeProperty('--app-h'); return; }
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;      // con el teclado abierto no se toca
  const portrait = window.innerHeight >= window.innerWidth;
  const full = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
  const h = window.innerHeight < full - 1 ? full : window.innerHeight;
  de.style.setProperty('--app-h', h + 'px');
}
function fit() {
  fitHeight();
  if (window.matchMedia('(max-width:500px)').matches) { document.documentElement.style.removeProperty('--fit'); return; }
  const s = Math.min(1, (window.innerHeight - 70) / 868, (window.innerWidth - 24) / 414);
  document.documentElement.style.setProperty('--fit', s.toFixed(3));
}
document.addEventListener('DOMContentLoaded', () => {
  /* Márgenes seguros que envía la app nativa del iPhone (notch / indicador de inicio) */
  const ni = window.__nativeInsets;
  if (ni) { document.documentElement.style.setProperty('--sat-native', (+ni.top || 0) + 'px'); document.documentElement.style.setProperty('--sab-native', (+ni.bottom || 0) + 'px'); }
  applyStyle();
  fit(); window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 300));
  window.addEventListener('pageshow', fit);
  document.addEventListener('focusout', () => setTimeout(fitHeight, 350));
  setTimeout(fit, 400);
  clock(); setInterval(clock, 15000);
  setInterval(() => refreshNowLine(), 30000);
  /* En iPhone, :active (resaltado al tocar) necesita un escucha de touchstart */
  document.addEventListener('touchstart', () => {}, { passive: true });
  const app = $('#app');
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || !app.contains(t)) return;
    if (Date.now() < swallowUntil || ($('#drawer')._swallowClick && $('#drawer').contains(t))) { e.preventDefault(); return; }
    if (busy && t.dataset.act !== 'verTap') { e.preventDefault(); return; }
    const fn = Actions[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t, e); }
  });
  $('#drawerOverlay').addEventListener('click', () => { if (!$('#drawer')._swallowClick) closeDrawer(); });
  $('#sheetOverlay').addEventListener('click', () => closeSheet());
  $('#sheetClose').addEventListener('click', () => closeSheet());
  edgeSwipeBack();
  drawerDrag();
  sheetDrag();
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    window.__androidBack();
  });
  setRoot('splash');
});
window.__replica = { S, D, setRoot, push, pop, Actions, botReply, calcContinua, calcFinal, fmtFinal };
})();
