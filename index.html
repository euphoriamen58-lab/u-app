      box.addEventListener('input', onField);
      box.addEventListener('change', onField);
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-la]'); if (!b) return;
        const k = c(), la = b.dataset.la;
        if (la === 'none') return;
        if (la === 'tab') { st.tab = b.dataset.t; render(el); return; }
        if (la === 'color') { k.color = b.dataset.c; saveData(); render(el); return; }
        if (la === 'addSlot') { k.slots.push({ dow: 1, ini: '08:00', fin: '10:00', aula: 'AULA' }); }
        if (la === 'delSlot') { k.slots.splice(+b.dataset.i, 1); }
        if (la === 'addEval') { k.notas.evaluaciones.push({ nombre: 'Evaluación ' + (k.notas.evaluaciones.length + 1), peso: 0, nota: null }); }
        if (la === 'delEval') { k.notas.evaluaciones.splice(+b.dataset.i, 1); }
        if (la === 'addComp') { k.notas.componentes.push({ nombre: 'Examen final', peso: 0, tipo: 'directa', nota: null }); }
        if (la === 'delComp') { k.notas.componentes.splice(+b.dataset.i, 1); }
        if (la === 'applyPct') {
          const v = parseVal('num', $('[data-f="_pct"]', el).value);
          if (!(v >= 0 && v <= 100)) { toast('Ingresa un porcentaje entre 0 y 100'); return; }
          k.horas.faltas = Math.round(k.horas.total * v / 100);
          if (k.horas.asist + k.horas.faltas > k.horas.total) k.horas.asist = Math.max(0, k.horas.total - k.horas.faltas);
          toast('Inasistencia: ' + k.horas.faltas + ' de ' + k.horas.total + ' horas');
        }
        if (la === 'viewNotas') { S.logged = true; S.tab = 'aula'; const id = k.id; setRoot('intranet'); push('curso', { id }); push('notas', { id }); return; }
        if (la === 'delete') {
          modal({ title: 'Eliminar curso', body: '¿Eliminar <b>' + esc(k.nombre) + '</b> de la app?', actions: [{ label: 'Cancelar' }, { label: 'Eliminar', cls: 'danger', fn: () => {
            D.CURSOS.splice(D.CURSOS.indexOf(k), 1); saveData(); toast('Curso eliminado'); pop();
          } }] });
          return;
        }
        saveData(); render(el);
      });
    },
  };
};

/* ======================================================================
   ACCIONES (delegación de clics)
   ====================================================================== */
const Actions = {
  drawer: openDrawer,
  back: pop,
  section: b => { closeDrawer(); setRoot(b.dataset.s); },
  tab: b => { S.tab = b.dataset.t; if (S.tab === 'horario') S.dayOffset = 0; renderIntranet(); },
  day: b => { const d = +b.dataset.d; S.dayOffset = d === 0 ? 0 : S.dayOffset + d; renderIntranet(); },
  refresh: b => {
    b.textContent = 'Actualizando…';
    setTimeout(() => { S.updatedAt = Date.now(); if (S.tab === 'aula') renderIntranet(); }, 900);
  },
  privacy: () => { S.privacy = !S.privacy; renderIntranet(); },
  push: b => push(b.dataset.v, { id: b.dataset.id }),
  login: b => {
    b.innerHTML = '<span class="spinner" style="width:20px;height:20px;border-width:2.5px"></span>';
    setTimeout(() => {
      S.logged = true; S.tab = 'horario'; S.dayOffset = 0;
      renderIntranet();
      if (!S.noticeShown) {
        S.noticeShown = true;
        setTimeout(() => modal({
          banner: { kicker: 'Aviso', big: 'Encuesta Referencial Docente', icon: 'encuesta' },
          body: 'Ya puedes completar la encuesta de tus cursos del periodo ' + esc(A.periodo || '') + '. (Aviso de ejemplo)',
          actions: [{ label: 'Cerrar' }, { label: 'Ir a la encuesta', cls: 'strong', fn: () => push('encuestas') }],
        }), 350);
      }
    }, 800);
  },
  forgot: () => toast('En la app oficial se abre la recuperación de contraseña. Esta réplica no maneja contraseñas.'),
  logout: () => modal({
    title: 'Cerrar sesión', body: '¿Deseas cerrar tu sesión?',
    actions: [{ label: 'Cancelar' }, { label: 'Cerrar sesión', cls: 'danger', fn: () => { S.logged = false; setRoot('intranet'); } }],
  }),
  slot: b => {
    const c = curso(b.dataset.c), s = c && c.slots[+b.dataset.i];
    if (!s) return;
    openSheet(c.nombre, '<div class="kv"><span class="k">Hora</span><span class="v">' + fmt12(s.ini) + ' - ' + fmt12(s.fin) + '</span></div>' +
      '<div class="kv"><span class="k">Lugar</span><span class="v">' + esc(s.aula) + '</span></div>' +
      '<div class="kv"><span class="k">Sección</span><span class="v">' + esc(c.seccion) + '</span></div>' +
      '<div class="kv"><span class="k">Docente</span><span class="v">' + esc(c.docente) + '</span></div>' +
      '<div class="btns" style="padding:14px 0 4px"><button class="btn" data-act="goCurso" data-id="' + c.id + '">Ver en Aula Virtual</button></div>');
  },
  mail: b => {
    const c = curso(b.dataset.id), to = b.dataset.to;
    const dest = to ? esc(to) : 'Todos los contactos de ' + esc(c.nombre) + ' (' + (classList(c).length + 1) + ')';
    openSheet('Nuevo correo', '<div class="kv"><span class="k">Para</span><span class="v">' + dest + '</span></div>' +
      '<div style="margin-top:12px"><input id="mailSubj" class="ta" style="min-height:0;height:44px" placeholder="Asunto" value="' + esc(c.nombre) + ' – Sección ' + esc(c.seccion) + '"></div>' +
      '<div style="margin-top:10px"><textarea class="ta" placeholder="Escribe tu mensaje…"></textarea></div>' +
      '<div class="btns" style="padding:14px 0 4px"><button class="btn" data-act="sendMail">' + ic('send') + 'Enviar</button></div>');
  },
  sendMail: () => { closeSheet(); toast('Correo enviado (simulación: no se envió nada)'); },
  pay: b => {
    const x = D.PAGOS[+b.dataset.i];
    if (x.pagado) { toast('Documento ' + x.doc + ' pagado'); return; }
    modal({
      title: 'Pagar ' + money(x.monto),
      body: esc(x.concepto) + '<br><br>En la app oficial el pago se realiza con tarjeta en una pasarela de pagos segura. Esta réplica no procesa pagos ni solicita datos de tarjetas.',
      actions: [{ label: 'Entendido', cls: 'strong' }],
    });
  },
  join: b => {
    const id = b.dataset.id;
    S.inscritos[id] = !S.inscritos[id]; store.set('inscritos', S.inscritos);
    b.textContent = S.inscritos[id] ? 'Inscrito ✓' : 'Inscribirme';
    toast(S.inscritos[id] ? 'Inscripción registrada (simulación)' : 'Inscripción anulada');
  },
  repo: b => openSheet('Repositorio', '<p><b>' + esc(b.dataset.t) + '</b></p><div class="btns" style="padding:4px 0 6px"><button class="btn" data-act="toast" data-m="Descarga no disponible en la réplica">' + ic('download') + 'Ver documento</button></div>'),
  toast: b => toast(esc(b.dataset.m)),
  ask: b => sendChat(b.dataset.q),
  chatReset: () => { S.chat = GREETING.slice(); renderChat(); toast('Conversación reiniciada'); },
  goTab: b => { S.tab = b.dataset.t; S.dayOffset = 0; setRoot('intranet'); if (!S.logged) toast('Inicia sesión para ver tu información'); },
  goPush: b => {
    closeSheet();
    if (!S.logged) { setRoot('intranet'); toast('Inicia sesión primero'); return; }
    if (S.stack[0].name !== 'intranet') setRoot('intranet');
    push(b.dataset.v);
  },
  goCurso: b => {
    closeSheet();
    if (!S.logged) { setRoot('intranet'); toast('Inicia sesión primero'); return false; }
    if (S.stack[0].name !== 'intranet') { S.tab = 'aula'; setRoot('intranet'); }
    if (!curso(b.dataset.id)) return false;
    push('curso', { id: b.dataset.id });
    return true;
  },
  goNotas: b => { if (Actions.goCurso(b)) push('notas', { id: b.dataset.id }); },
  /* Acceso oculto: tocar 5 veces la versión en Ayuda */
  verTap: () => {
    verTaps++;
    clearTimeout(verTimer);
    verTimer = setTimeout(() => { verTaps = 0; }, 2500);
    if (verTaps >= 5) { verTaps = 0; askPassword(); }
  },
  admOpt: b => {
    const k = b.dataset.k, v = b.dataset.v;
    D.OPCIONES[k] = v === 'true' ? true : v === 'false' ? false : v;
    saveData();
    const t = topView(); if (t && t.def.resume) t.def.resume(t.el);
  },
  admAdd: () => {
    const used = D.CURSOS.map(c => c.color.toLowerCase());
    const color = PALETTE.find(x => used.indexOf(x.toLowerCase()) < 0) || PALETTE[D.CURSOS.length % PALETTE.length];
    const c = {
      id: newId(), nombre: 'NUEVO CURSO', seccion: '000', color, horas: { asist: 0, faltas: 0, total: 64 },
      slots: [{ dow: 1, ini: '08:00', fin: '10:00', aula: 'AULA' }],
      notas: { componentes: [{ nombre: 'Evaluación Continua', peso: 100, tipo: 'continua', nota: null }], evaluaciones: [{ nombre: 'Evaluación 1', peso: 100, nota: null }] },
      asesorias: [], docente: 'POR ASIGNAR',
    };
    D.CURSOS.push(c); saveData();
    push('adminCurso', { id: c.id });
  },
  admView: () => { S.logged = true; S.tab = 'aula'; setRoot('intranet'); },
  admReset: () => modal({
    title: 'Restablecer datos', body: 'Se borrarán todos los cambios del panel y volverán los datos de ejemplo.',
    actions: [{ label: 'Cancelar' }, { label: 'Restablecer', cls: 'danger', fn: () => {
      resetData(); toast('Datos de ejemplo restablecidos');
      const t = topView(); if (t && t.def.resume) t.def.resume(t.el);
    } }],
  }),
};

/* ---------- Botón "atrás" de Android ---------- */
window.__androidBack = function () {
  const m = $('.modal-wrap'); if (m) { m.remove(); return; }
  if (appEl().classList.contains('sheet-open')) { closeSheet(); return; }
  if (appEl().classList.contains('drawer-open')) { closeDrawer(); return; }
  if (S.stack.length > 1) { pop(); return; }
  const root = S.stack[0] ? S.stack[0].name : '';
  if (root && root !== 'intranet' && root !== 'splash') { setRoot('intranet'); return; }
  if (window.AndroidApp && window.AndroidApp.exit) window.AndroidApp.exit();
  else if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'exit' }));
};

/* ---------- Arranque ---------- */
function clock() {
  const n = new Date(), h = n.getHours() % 12 || 12;
  $('#sbTime').textContent = h + ':' + pad(n.getMinutes());
}
function fit() {
  if (window.matchMedia('(max-width:500px)').matches) { document.documentElement.style.removeProperty('--fit'); return; }
  const s = Math.min(1, (window.innerHeight - 70) / 868, (window.innerWidth - 24) / 414);
  document.documentElement.style.setProperty('--fit', s.toFixed(3));
}
document.addEventListener('DOMContentLoaded', () => {
  /* Márgenes seguros que envía la app nativa del iPhone (notch / indicador de inicio) */
  const ni = window.__nativeInsets;
  if (ni) { document.documentElement.style.setProperty('--sat-native', (+ni.top || 0) + 'px'); document.documentElement.style.setProperty('--sab-native', (+ni.bottom || 0) + 'px'); }
  fit(); window.addEventListener('resize', fit);
  clock(); setInterval(clock, 15000);
  const app = $('#app');
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || !app.contains(t)) return;
    const fn = Actions[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t, e); }
  });
  $('#drawerOverlay').addEventListener('click', closeDrawer);
  $('#sheetOverlay').addEventListener('click', closeSheet);
  $('#sheetClose').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    window.__androidBack();
  });
  setRoot('splash');
});
window.__replica = { S, D, setRoot, push, pop, Actions, botReply, calcContinua, calcFinal, fmtFinal };
})();

</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
